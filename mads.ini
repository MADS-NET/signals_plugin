[agents]
# Settings shared by all agents
frontend_address = "tcp://localhost:9090"
backend_address = "tcp://localhost:9091"
settings_address = "tcp://localhost:9092"
timecode_fps = 25
# Outgoing payload encoding, fleet-wide default (can be overridden per agent).
#   wire_format: "json" (default) or "msgpack"
#   compression: "auto" (default, compress only frames >= 256 B), "snappy"
#                (always) or "none"
# wire_format = "json"
# compression = "auto"


#  __  __                   _ _ _   _     _      
# |  \/  | ___  _ __   ___ | (_) |_| |__ (_) ___ 
# | |\/| |/ _ \| '_ \ / _ \| | | __| '_ \| |/ __|
# | |  | | (_) | | | | (_) | | | |_| | | | | (__ 
# |_|  |_|\___/|_| |_|\___/|_|_|\__|_| |_|_|\___|
#                                                

[broker]
frontend_address = "tcp://*:9090"
backend_address = "tcp://*:9091"
settings_address = "tcp://*:9092"
prefer_loopback_for_local_services = true
# The followings are only needed if using CURVE encryption
# auth_verbose = false
# ip_whitelist = ["127.0.0.1"] # default is empty (allow all)

[signals]
period = 200            # ms, loop period: the sampling rate is its reciprocal
seed = 20260909         # optional, for reproducible noise
nest = ""               # "" publishes the values flat, a name nests them
track_period = true     # follow the call period actually observed
f0 = 0.25               # any extra key is usable in expressions, as "$f0"

# one table per signal, named after the field it feeds
[signals.signals.temperature]
type = "sine"
frequency = "$f0"       # Hz
amplitude = 10.0
offset = 25.0
snr_db = 30             # intrinsic noise, in dB; omit for the 40 dB default

[signals.signals.pressure]
type = "composite"
op = "sum"
components = [
  { type = "square", frequency = "$f0 / 5", amplitude = 0.5, offset = 3.0, noiseless = true },
  { type = "white_noise", sigma = 0.02 }
]